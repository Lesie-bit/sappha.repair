<!DOCTYPE html>
<html lang="th">
<head>
    <script>
        const user = JSON.parse(localStorage.getItem('user'))
        if (!user || user.role !== 'technician') { window.location.href = '/login.html' }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าช่าง - ระบบแจ้งซ่อมบำรุงโรงเรียนสรรพวิทยาคม</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --navy: #173b67; --navy-deep: #102c4d; --navy-mid: #2d628f; --navy-pale: #edf4fa; --gold: #c9922a; --ink: #203047; --muted: #6b7a8c; --line: #dce5ee; --shadow: 0 12px 30px rgba(18, 49, 82, 0.08); }
        body { background: #f5f8fb; color: var(--ink); font-family: 'Segoe UI', 'Sarabun', sans-serif; }
        .navbar-main { background: linear-gradient(110deg, var(--navy-deep), var(--navy)); border-bottom: 3px solid var(--gold); box-shadow: 0 4px 18px rgba(16,44,77,.18); }
        .brand-mark { width: 42px; height: 42px; background: rgba(201,146,42,.18); border: 1px solid rgba(229,199,107,.45); }
        .page-intro { background: linear-gradient(120deg, var(--navy-deep), var(--navy-mid)); color: white; padding: 28px 0 42px; position: relative; overflow: hidden; }
        .page-intro::after { content: ''; position: absolute; width: 260px; height: 260px; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; right: -70px; top: -120px; }
        .content-wrap { margin-top: -22px; position: relative; z-index: 1; }
        .summary-card { border: 1px solid rgba(220,229,238,.8); border-radius: 14px; box-shadow: var(--shadow); background: white; transition: transform .2s, box-shadow .2s; }
        .summary-card:hover { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(18,49,82,.12); }
        .summary-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 1.15rem; }
        .summary-value { font-size: 1.75rem; line-height: 1; }
        .toolbar { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: 0 5px 18px rgba(18,49,82,.05); }
        .filter-btn { border-radius: 9px; font-size: .85rem; border-color: transparent; color: var(--muted); padding: 8px 14px; }
        .filter-btn:hover { background: var(--navy-pale); color: var(--navy); }
        .btn-navy { background: var(--navy); color: white; border: none; }
        .btn-navy:hover { background: var(--navy-mid); color: white; }
        .repair-card { border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 5px 18px rgba(18,49,82,.05); margin-bottom: 14px; transition: transform .2s, box-shadow .2s; border-left: 4px solid transparent; overflow: hidden; }
        .repair-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .repair-card[data-status="pending"] { border-left-color: #2d628f; }
        .repair-card[data-status="in_progress"] { border-left-color: var(--gold); }
        .repair-card[data-status="done"] { border-left-color: #2e7d52; }
        .status-pill { font-size: .76rem; font-weight: 700; padding: 6px 11px; border-radius: 8px; white-space: nowrap; }
        .status-pending { background: #e8f0f8; color: #1b3a6b; }
        .status-in_progress { background: #fdf2df; color: #9a6915; }
        .status-done { background: #e6f4ec; color: #2e7d52; }
        .cat-badge { font-size: .75rem; background: var(--navy-pale); color: var(--navy); padding: 4px 9px; border-radius: 6px; font-weight: 700; }
        .repair-img { width: 78px; height: 78px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 2px solid var(--line); transition: transform .2s; }
        .repair-img:hover { transform: scale(1.04); }
        .modal-header-navy { background: var(--navy); color: white; border-bottom: 3px solid var(--gold); }
        .form-control, .form-select { border-color: var(--line); border-radius: 9px; padding: 10px 12px; }
        .form-control:focus, .form-select:focus { border-color: var(--navy-mid); box-shadow: 0 0 0 3px rgba(45,98,143,.14); }
        footer { background: var(--navy-deep); color: rgba(255,255,255,.65); }
        @media (max-width: 575.98px) { .navbar-main .container { padding-left: 18px !important; padding-right: 18px !important; } .brand-copy small { display: none; } .brand-copy span { font-size: .9rem; } .page-intro { padding: 22px 0 36px; } .content-wrap { margin-top: -16px; } .toolbar { padding: 8px; } .filter-btn { flex: 1 1 calc(50% - 8px); } .repair-card .card-body { padding: 18px !important; } .status-pill { font-size: .7rem; } }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-main py-3">
        <div class="container px-4 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <div class="brand-mark text-white rounded-circle d-flex align-items-center justify-content-center">
                    <i class="bi bi-wrench-adjustable text-warning fs-5"></i>
                </div>
                <div class="brand-copy">
                    <span class="fw-bold text-white d-block">หน้าช่างซ่อมบำรุง</span>
                    <small class="text-white-50">โรงเรียนสรรพวิทยาคม</small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white small"><i class="bi bi-person-circle me-1"></i><span id="techName"></span></span>
                <button onclick="logout()" class="btn btn-outline-light btn-sm">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <section class="page-intro">
        <div class="container px-4">
            <p class="text-uppercase small fw-semibold mb-2 opacity-75" style="letter-spacing:.12em">Technician workspace</p>
            <h1 class="h3 fw-bold mb-1">จัดการงานแจ้งซ่อม</h1>
            <p class="mb-0 opacity-75">ติดตาม รับงาน และอัปเดตสถานะงานซ่อมในที่เดียว</p>
        </div>
    </section>

    <div class="container px-4 content-wrap flex-grow-1">
        <!-- Summary -->
        <div class="row g-3 mb-4">
            <div class="col-4">
                <div class="summary-card p-3 d-flex align-items-center gap-3">
                    <div class="summary-icon" style="background:#e8f0f8;color:#1b3a6b"><i class="bi bi-inbox"></i></div>
                    <div><h3 class="summary-value fw-bold mb-1" id="cntPending" style="color:#1B3A6B">-</h3><small class="text-muted">รอรับเรื่อง</small></div>
                </div>
            </div>
            <div class="col-4">
                <div class="summary-card p-3 d-flex align-items-center gap-3">
                    <div class="summary-icon" style="background:#fef3e2;color:#c9922a"><i class="bi bi-tools"></i></div>
                    <div><h3 class="summary-value fw-bold mb-1" id="cntInProgress" style="color:#C9922A">-</h3><small class="text-muted">กำลังทำ</small></div>
                </div>
            </div>
            <div class="col-4">
                <div class="summary-card p-3 d-flex align-items-center gap-3">
                    <div class="summary-icon" style="background:#e6f4ec;color:#2e7d52"><i class="bi bi-check2-circle"></i></div>
                    <div><h3 class="summary-value fw-bold mb-1" id="cntDone" style="color:#2E7D52">-</h3><small class="text-muted">เสร็จแล้ว</small></div>
                </div>
            </div>
        </div>

        <!-- Filter -->
        <div class="toolbar d-flex align-items-center gap-2 mb-4 flex-wrap">
            <span class="small fw-bold text-muted me-1"><i class="bi bi-funnel me-1"></i>แสดงงาน</span>
            <button class="btn btn-navy filter-btn status-filter active" data-status="all" onclick="filterStatus('all', this)">ทั้งหมด</button>
            <button class="btn btn-outline-secondary filter-btn status-filter" data-status="pending" onclick="filterStatus('pending', this)">รอรับเรื่อง</button>
            <button class="btn btn-outline-secondary filter-btn status-filter" data-status="in_progress" onclick="filterStatus('in_progress', this)">กำลังดำเนินการ</button>
            <button class="btn btn-outline-secondary filter-btn status-filter" data-status="done" onclick="filterStatus('done', this)">เสร็จแล้ว</button>
            <select class="form-select form-select-sm ms-md-auto" id="categoryFilter" onchange="filterCategory(this.value)" style="max-width:210px" aria-label="กรองหมวดปัญหา">
                <option value="all">ทุกหมวดปัญหา</option>
                <option value="ไฟฟ้า">ไฟฟ้า</option>
                <option value="ประปา">ประปา</option>
                <option value="อาคาร">อาคาร/สิ่งก่อสร้าง</option>
                <option value="คอมพิวเตอร์">คอมพิวเตอร์/IT</option>
            </select>
        </div>

        <div id="loadingMsg" class="text-center py-5 text-muted">
            <div class="spinner-border mb-2" style="color:#1B3A6B"></div>
            <p class="mb-0">กำลังโหลดข้อมูล...</p>
        </div>
        <div id="repairList"></div>
    </div>

    <footer class="py-4 mt-5">
        <div class="container px-4 text-center">
            <small>© 2026 ระบบแจ้งซ่อมบำรุง โรงเรียนสรรพวิทยาคม</small>
        </div>
    </footer>

    <!-- Modal รูป -->
    <div class="modal fade" id="imgModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0">
                <div class="modal-body p-0 text-center bg-dark">
                    <img id="imgModalSrc" src="" class="img-fluid" style="max-height:80vh;">
                </div>
            </div>
        </div>
    </div>

    <!-- Modal อัปเดต -->
    <div class="modal fade" id="updateModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header modal-header-navy">
                    <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>อัปเดตสถานะงาน</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="bg-light rounded p-3 mb-3 border-start border-4" style="border-color:#1B3A6B !important">
                        <p class="mb-0 fw-semibold" id="modalTitle"></p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">สถานะ</label>
                        <select class="form-select" id="modalStatus">
                            <option value="in_progress">🔧 กำลังดำเนินการ (รับงาน)</option>
                            <option value="done">✅ เสร็จแล้ว</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">หมายเหตุ/บันทึกผล</label>
                        <textarea class="form-control" id="modalNote" rows="3" placeholder="เช่น สั่งอะไหล่เพิ่ม, ดำเนินการแล้วเสร็จ..."></textarea>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-navy px-4" onclick="submitUpdate()">
                        <i class="bi bi-check-lg me-1"></i>บันทึก
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="auth-ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('token')
        let allRepairs = []
        let currentId = null
        let selectedStatus = 'all'
        let selectedCategory = 'all'

        document.getElementById('techName').textContent = user?.name || ''

        async function loadRepairs() {
            try {
                const res = await fetch('/api/repairs?all=true', { headers: { 'Authorization': `Bearer ${token}` } })
                allRepairs = await res.json()
                document.getElementById('loadingMsg').style.display = 'none'

                // update summary counts
                document.getElementById('cntPending').textContent = allRepairs.filter(r => r.status === 'pending').length
                document.getElementById('cntInProgress').textContent = allRepairs.filter(r => r.status === 'in_progress').length
                document.getElementById('cntDone').textContent = allRepairs.filter(r => r.status === 'done').length

                renderList(allRepairs)
            } catch {
                document.getElementById('loadingMsg').innerHTML = '<p class="text-danger">โหลดข้อมูลไม่สำเร็จ</p>'
            }
        }

        function renderList(repairs) {
            const list = document.getElementById('repairList')
            if (!repairs.length) {
                list.innerHTML = '<div class="text-center text-muted py-5"><i class="bi bi-inbox fs-1 d-block mb-2"></i>ไม่มีคำขอในขณะนี้</div>'
                return
            }
            list.innerHTML = repairs.map(r => {
                const date = new Date(r.created_at).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' })
                const statusLabel = { pending: 'รอรับเรื่อง', in_progress: 'กำลังดำเนินการ', done: 'เสร็จแล้ว' }
                const statusCls = { pending: 'status-pending', in_progress: 'status-in_progress', done: 'status-done' }
                const imgHtml = r.image_url ? `<img src="${r.image_url}" class="repair-img me-2" onclick="showImg('${r.image_url}')">` : ''
                const assignedHtml = r.assigned_to ? `<small class="text-muted"><i class="bi bi-person-check me-1"></i>ช่างผู้รับ: <strong>${r.assigned_to}</strong></small><br>` : ''
                const noteHtml = r.note ? `<small class="text-muted"><i class="bi bi-chat-text me-1"></i>${r.note}</small><br>` : ''
                const catBadge = r.sub_category
                    ? `<span class="cat-badge">${r.category}</span> <small class="text-muted">› ${r.sub_category}</small>`
                    : `<span class="cat-badge">${r.category || ''}</span>`
                const btnHtml = r.status !== 'done'
                    ? `<button class="btn btn-navy btn-sm mt-2" onclick="openUpdate('${r._id}', '${r.title}')"><i class="bi bi-pencil-square me-1"></i>อัปเดตสถานะ</button>`
                    : `<span class="status-pill status-done mt-2 d-inline-block">✅ เสร็จแล้ว</span>`

                return `<div class="card repair-card" data-status="${r.status}">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <h6 class="fw-bold mb-1">${r.title}</h6>
                                <div class="mb-1">${catBadge}</div>
                            </div>
                            <span class="status-pill ${statusCls[r.status]}">${statusLabel[r.status]}</span>
                        </div>
                        <div class="text-muted small mb-2">
                            <i class="bi bi-geo-alt me-1"></i>${r.location_building} ${r.location_detail || ''}
                            &nbsp;·&nbsp;<i class="bi bi-calendar me-1"></i>${date}
                            &nbsp;·&nbsp;<i class="bi bi-person me-1"></i>${r.reporter_name}
                            ${r.contact_number ? `&nbsp;·&nbsp;<i class="bi bi-telephone me-1"></i>${r.contact_number}` : ''}
                        </div>
                        <p class="mb-2 small">${r.description}</p>
                        ${assignedHtml}${noteHtml}
                        <div class="d-flex align-items-start gap-2 flex-wrap mt-2">${imgHtml}</div>
                        ${btnHtml}
                    </div>
                </div>`
            }).join('')
        }

        function applyFilters() {
            const filtered = allRepairs.filter(r =>
                (selectedStatus === 'all' || r.status === selectedStatus) &&
                (selectedCategory === 'all' || r.category === selectedCategory)
            )
            renderList(filtered)
        }

        function filterStatus(status, btn) {
            selectedStatus = status
            document.querySelectorAll('.status-filter').forEach(b => {
                b.className = 'btn btn-outline-secondary filter-btn'
            })
            btn.className = 'btn btn-navy filter-btn'
            applyFilters()
        }

        function filterCategory(category) {
            selectedCategory = category
            applyFilters()
        }

        function showImg(url) {
            document.getElementById('imgModalSrc').src = url
            new bootstrap.Modal(document.getElementById('imgModal')).show()
        }

        function openUpdate(id, title) {
            currentId = id
            document.getElementById('modalTitle').textContent = title
            document.getElementById('modalNote').value = ''
            new bootstrap.Modal(document.getElementById('updateModal')).show()
        }

        async function submitUpdate() {
            const status = document.getElementById('modalStatus').value
            const note = document.getElementById('modalNote').value
            try {
                const res = await fetch(`/api/repairs/${currentId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ status, note })
                })
                const data = await res.json()
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('updateModal')).hide()
                    await loadRepairs()
                } else { alert('❌ ' + data.error) }
            } catch { alert('❌ เกิดข้อผิดพลาด') }
        }

        function logout() {
            localStorage.removeItem('token')
            localStorage.removeItem('user')
            showAuthOverlay('กำลังออกจากระบบ', '/login.html', 'logout')
        }

        loadRepairs()
    </script>
</body>
</html>
