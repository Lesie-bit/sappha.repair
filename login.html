<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบแจ้งซ่อมบำรุงโรงเรียนสรรพวิทยาคม</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --navy: #1B3A6B;
            --navy-mid: #2D5F8A;
            --navy-light: #4A90C4;
            --navy-pale: #E8F0F8;
            --bg: #F0F4F8;
            --text: #1A2744;
        }
        body {
            background: linear-gradient(135deg, #1B3A6B 0%, #2D5F8A 50%, #4A90C4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', 'Sarabun', sans-serif;
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .login-header {
            background: var(--navy);
            color: white;
            text-align: center;
            padding: 2.5rem 1rem 2rem;
            border-bottom: 3px solid #C9922A;
        }
        .school-emblem {
            width: 72px;
            height: 72px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            border: 2px solid rgba(201,146,42,0.6);
        }
        .login-body { padding: 2rem; background: white; }
        .form-control:focus, .form-select:focus {
            border-color: var(--navy-light);
            box-shadow: 0 0 0 3px rgba(74,144,196,0.15);
        }
        .input-group-text { background: var(--navy-pale); border-color: #D1DCE8; color: var(--navy); }
        .password-toggle { border-color: #D1DCE8; color: var(--navy); background: white; }
        .password-toggle:hover { color: var(--navy-mid); background: var(--navy-pale); }
        .btn-navy {
            background: var(--navy);
            color: white;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-navy:hover { background: var(--navy-mid); color: white; transform: translateY(-1px); }
        .btn-navy:disabled { background: #8899BB; color: white; transform: none; }
        .demo-section { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #E5ECF4; }
        .demo-title { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: #66768d; }
        .demo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.65rem; margin-top: 0.8rem; }
        .demo-btn {
            border: 1px solid #D8E5F1; background: linear-gradient(180deg, #ffffff 0%, #F6FAFF 100%);
            border-radius: 10px; padding: 0.7rem 0.45rem; color: var(--navy); font-weight: 600; transition: all 0.2s ease; box-shadow: 0 6px 14px rgba(27,58,107,0.05);
        }
        .demo-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(27,58,107,0.12); }
        .demo-btn.reporter { border-color: #CDE1F5; }
        .demo-btn.admin { border-color: #F3DFA2; background: linear-gradient(180deg, #fffdf5 0%, #fff7df 100%); }
        .demo-btn.technician { border-color: #D7EEDF; background: linear-gradient(180deg, #f4fff7 0%, #ebf9ef 100%); }
        .demo-btn small { display: block; font-size: 0.68rem; opacity: 0.8; margin-top: 0.15rem; }
        footer { background: rgba(0,0,0,0.2); color: rgba(255,255,255,0.6); }
        a { color: var(--navy-light); }
    </style>
</head>
<body>
    <main class="login-wrapper">
        <div class="card login-card">
            <div class="login-header">
                <div class="school-emblem">
                    <i class="bi bi-tools fs-2 text-white"></i>
                </div>
                <h4 class="mb-1 fw-bold">เข้าสู่ระบบ</h4>
                <p class="mb-0 text-white-50 small">ระบบแจ้งซ่อมบำรุง โรงเรียนสรรพวิทยาคม</p>
            </div>
            <div class="login-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small">อีเมลโรงเรียน</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="ชื่อ@sappha.ac.th" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">รหัสผ่าน</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            <button class="btn password-toggle" type="button" data-target="password" aria-label="แสดงรหัสผ่าน"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-navy btn-lg" id="submitBtn">
                            <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ
                        </button>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn btn-link btn-sm text-decoration-none mb-2" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                            <i class="bi bi-key me-1"></i>ลืมรหัสผ่าน?
                        </button>
                        <br>
                        <small class="text-muted">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></small>
                    </div>
                </form>

                <div class="demo-section">
                    <div class="demo-title text-center">ดูตัวอย่างการใช้งาน</div>
                    <div class="demo-grid">
                        <button type="button" class="demo-btn reporter" data-demo-role="reporter">
                            <span>คนแจ้ง</span>
                            <small>แจ้งซ่อม</small>
                        </button>
                        <button type="button" class="demo-btn admin" data-demo-role="admin">
                            <span>แอดมิน</span>
                            <small>จัดการ</small>
                        </button>
                        <button type="button" class="demo-btn technician" data-demo-role="technician">
                            <span>ช่าง</span>
                            <small>ซ่อมได้</small>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="forgotPasswordTitle"><i class="bi bi-shield-lock me-2"></i>ตั้งรหัสผ่านใหม่</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="ปิด"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small" id="forgotHint">กรอกอีเมลโรงเรียน ระบบจะส่ง OTP ให้คุณ</p>
                    <form id="forgotPasswordForm">
                        <div id="forgotEmailStep">
                            <label class="form-label fw-semibold small">อีเมลโรงเรียน</label>
                            <input type="email" class="form-control" id="forgotEmail" placeholder="ชื่อ@sappha.ac.th" required>
                        </div>
                        <div id="resetStep" class="d-none">
                            <label class="form-label fw-semibold small">รหัส OTP</label>
                            <input type="text" class="form-control text-center fs-4 mb-3" id="resetOtp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="กรอกรหัส 6 หลัก">
                            <label class="form-label fw-semibold small">รหัสผ่านใหม่</label>
                            <div class="input-group mb-2">
                                <input type="password" class="form-control" id="newPassword" minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร">
                                <button class="btn password-toggle" type="button" data-target="newPassword" aria-label="แสดงรหัสผ่าน"><i class="bi bi-eye"></i></button>
                            </div>
                            <label class="form-label fw-semibold small">ยืนยันรหัสผ่านใหม่</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="confirmNewPassword" minlength="6" placeholder="กรอกรหัสผ่านอีกครั้ง">
                                <button class="btn password-toggle" type="button" data-target="confirmNewPassword" aria-label="แสดงรหัสผ่าน"><i class="bi bi-eye"></i></button>
                            </div>
                            <small class="text-danger d-none" id="resetPasswordError">รหัสผ่านไม่ตรงกัน</small>
                        </div>
                        <button type="submit" class="btn btn-navy w-100 mt-4" id="forgotSubmitBtn">ส่ง OTP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer class="py-3 text-center">
        <small>© 2026 ระบบแจ้งซ่อมบำรุง โรงเรียนสรรพวิทยาคม | พัฒนาโดยนักเรียนห้องเรียนเทคโนโลยีดิจิทัล</small>
    </footer>
    <script src="auth-ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.password-toggle').forEach(function(toggle) {
            toggle.addEventListener('click', function() {
                const input = document.getElementById(toggle.dataset.target)
                const icon = toggle.querySelector('i')
                const isVisible = input.type === 'text'
                input.type = isVisible ? 'password' : 'text'
                icon.className = isVisible ? 'bi bi-eye' : 'bi bi-eye-slash'
                toggle.setAttribute('aria-label', isVisible ? 'แสดงรหัสผ่าน' : 'ซ่อนรหัสผ่าน')
            })
        })

        let otpSent = false
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault()
            const email = document.getElementById('forgotEmail').value.trim().toLowerCase()
            const btn = document.getElementById('forgotSubmitBtn')
            const newPassword = document.getElementById('newPassword')
            const confirmNewPassword = document.getElementById('confirmNewPassword')
            if (otpSent && newPassword.value !== confirmNewPassword.value) {
                document.getElementById('resetPasswordError').classList.remove('d-none')
                confirmNewPassword.focus()
                return
            }
            document.getElementById('resetPasswordError').classList.add('d-none')
            btn.disabled = true
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังดำเนินการ...'
            const endpoint = otpSent ? '/api/auth/reset-password' : '/api/auth/forgot-password'
            const body = otpSent
                ? { email, otp: document.getElementById('resetOtp').value.trim(), password: newPassword.value }
                : { email }
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                })
                const data = await response.json()
                if (!response.ok || !data.success) throw new Error(data.error || 'ดำเนินการไม่สำเร็จ')
                if (otpSent) {
                    alert('ตั้งรหัสผ่านใหม่สำเร็จ กรุณาเข้าสู่ระบบ')
                    window.location.reload()
                    return
                }
                otpSent = true
                document.getElementById('forgotEmailStep').classList.add('d-none')
                document.getElementById('resetStep').classList.remove('d-none')
                document.getElementById('forgotEmail').required = false
                document.getElementById('resetOtp').required = true
                newPassword.required = true
                confirmNewPassword.required = true
                document.getElementById('resetOtp').focus()
                document.getElementById('forgotHint').textContent = 'กรอกรหัส OTP ที่ส่งไปยังอีเมลของคุณ รหัสมีอายุ 10 นาที'
                btn.disabled = false
                btn.innerHTML = 'ตั้งรหัสผ่านใหม่'
            } catch (error) {
                alert(error.message)
                btn.disabled = false
                btn.innerHTML = otpSent ? 'ตั้งรหัสผ่านใหม่' : 'ส่ง OTP'
            }
        })

        document.getElementById('forgotPasswordModal').addEventListener('hidden.bs.modal', function() {
            otpSent = false
            document.getElementById('forgotPasswordForm').reset()
            document.getElementById('forgotEmailStep').classList.remove('d-none')
            document.getElementById('resetStep').classList.add('d-none')
            document.getElementById('forgotEmail').required = true
            document.getElementById('resetOtp').required = false
            document.getElementById('newPassword').required = false
            document.getElementById('confirmNewPassword').required = false
            document.getElementById('forgotHint').textContent = 'กรอกอีเมลโรงเรียน ระบบจะส่ง OTP ให้คุณ'
            const btn = document.getElementById('forgotSubmitBtn')
            btn.disabled = false
            btn.innerHTML = 'ส่ง OTP'
        })

        const demoUsers = {
            reporter: {
                id: 'demo-user',
                name: 'นางสาวพรพิมล ใจดี',
                email: 'demo.reporter@sappha.ac.th',
                password: 'demo1234',
                role: 'user',
                department: 'ครูประจำชั้น'
            },
            admin: {
                id: 'demo-admin',
                name: 'นางสาววรรณา สมศรี',
                email: 'demo.admin@sappha.ac.th',
                password: 'admin1234',
                role: 'admin',
                department: 'ฝ่ายบริหาร'
            },
            technician: {
                id: 'demo-technician',
                name: 'นายกิตติศักดิ์ พรหมน้อย',
                email: 'demo.technician@sappha.ac.th',
                password: 'tech1234',
                role: 'technician',
                department: 'ช่างซ่อมบำรุง'
            }
        }

        document.querySelectorAll('.demo-btn').forEach(function(button) {
            button.addEventListener('click', function() {
                const demoKey = button.dataset.demoRole
                const demoUser = demoUsers[demoKey]
                if (!demoUser) return

                document.getElementById('email').value = demoUser.email
                document.getElementById('password').value = demoUser.password
                localStorage.setItem('token', `demo-token-${demoUser.role}`)
                localStorage.setItem('user', JSON.stringify(demoUser))

                const nextPage = demoUser.role === 'admin'
                    ? '/admin.html'
                    : demoUser.role === 'technician'
                        ? '/technician.html'
                        : '/index.html'

                showAuthOverlay(`เข้าสู่ระบบด้วยบัญชีตัวอย่าง ${button.textContent.trim()}`, nextPage)
            })
        })

        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault()
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const btn = document.getElementById('submitBtn')
            btn.disabled = true
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังเข้าสู่ระบบ...'
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })
                const data = await response.json()
                if (response.ok && data.token) {
                    localStorage.setItem('token', data.token)
                    localStorage.setItem('user', JSON.stringify(data.user))
                    const role = data.user.role
                    const nextPage = role === 'admin' ? '/admin.html' : role === 'technician' ? '/technician.html' : '/index.html'
                    showAuthOverlay('เข้าสู่ระบบสำเร็จ', nextPage)
                } else {
                    showAuthToast(data.error || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง')
                    btn.disabled = false
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ'
                }
            } catch {
                showAuthToast('เกิดข้อผิดพลาด กรุณาลองใหม่')
                btn.disabled = false
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ'
            }
        })
    </script>
</body>
</html>
